<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Voyage of Odysseus</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #0d1b2a; overflow: hidden; }
  #game { width: 100%; height: 100%; }
</style>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<script src="common.js"></script>
<script src="phrases.js"></script>
<script src="voyage_text.js"></script>
</head>
<body>
<div id="game"></div>
<script>
// =====================================================================
//  THE VOYAGE OF ODYSSEUS: sail from island to island; on every island she reads and does what the note says.
//  Scenes: Boot -> Sea (the map) -> Lotus, Cyclops, Circe, Sirens (deck) + SirensSea, Strait, Storm.
// =====================================================================
const W = 1280, H = 720;
const COLORS = [ // [english, hex, hebrew fem with ה, hebrew masc with ה]
  ['red', 0xe84545, 'האדומה', 'האדום'], ['blue', 0x3b82f6, 'הכחולה', 'הכחול'], ['green', 0x3fbf6f, 'הירוקה', 'הירוק'],
  ['yellow', 0xffd43b, 'הצהובה', 'הצהוב'], ['purple', 0x9b5de5, 'הסגולה', 'הסגול'], ['orange', 0xff8a1f, 'הכתומה', 'הכתום'],
];
const colorOf = en => COLORS.find(c => c[0] === en);
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => Phaser.Utils.Array.Shuffle(a.slice());
const aAn = w => (/^[aeiou]/.test(w) ? 'an ' : 'a ') + w;
const LR_HE = { left: 'שמאל', right: 'ימין' }, LR_TO = { left: 'שמאלה', right: 'ימינה' }, OPP = { left: 'right', right: 'left' };

const sfx = {
  coin: () => { tone(988, 988, .06, 'square', .04); setTimeout(() => tone(1319, 1319, .12, 'square', .04), 60); },
  good: () => [659, 880, 1175].forEach((f, i) => setTimeout(() => tone(f, f, .12, 'square', .06), i * 80)),
  wrong: () => { tone(300, 200, .12, 'square', .07); setTimeout(() => tone(220, 150, .18, 'square', .07), 110); },
  page: () => tone(800, 1200, .08, 'triangle', .04),
  win: () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, f, .25, 'square', .07), i * 140)),
  splash: () => tone(500, 120, .25, 'sawtooth', .05),
  song: () => [880, 988, 1175, 988].forEach((f, i) => setTimeout(() => tone(f, f * 1.01, .3, 'sine', .05), i * 220)),
  thunder: () => { tone(90, 40, .6, 'sawtooth', .09); setTimeout(() => tone(70, 35, .5, 'sawtooth', .07), 200); },
};

// who is speaking: [art keys to try, emoji, name shown on the note]
const WHO = {
  odysseus: [['art_odysseus'], '🧔', 'Odysseus'], hermes: [['art_hermes'], '🪽', 'Hermes'], circe: [['art_circe'], '🧙‍♀️', 'Circe'],
  cyclops: [['art_cyclops'], '👁️', 'The Cyclops'], siren: [['art_siren', 'art_harpy'], '🧜‍♀️', 'The Sirens'],
  penelope: [['art_penelope', 'card_penelope'], '👸', 'Penelope'], argos: [['card_argos'], '🐕', 'Argos'],
  athena: [['card_athena'], '🦉', 'Athena'], poseidon: [['card_poseidon'], '🔱', 'Poseidon'], log: [[], '📜', ''], bottle: [[], '🍾', 'A message in a bottle'],
};
const ITEMS = [['fish', 'דג'], ['apple', 'תפוח'], ['ball', 'כדור'], ['banana', 'בננה'], ['umbrella', 'מטרייה']];

// progress: how many islands are done (0..6)
const Voyage = {
  done() {
    // a voyage that was already finished (also a save from before the game started over at the end): start again at Troy
    const s = Save.get();
    if ((s.voyage || 0) >= VOY_ISLANDS.length) { s.voyage = 0; Save.set(s); }
    return s.voyage || 0;
  },
  finish(i) {
    const s = Save.get(); s.voyage = Math.max(s.voyage || 0, i + 1); s.cards = s.cards || [];
    const gifts = VOY_ISLANDS[i][4].filter(id => !s.cards.includes(id)); s.cards.push(...gifts);
    // the whole voyage is done: the next game starts again at Troy (the cards, drachmas and stars stay)
    if (i === VOY_ISLANDS.length - 1) s.voyage = 0;
    Save.set(s); Save.markDone('voyage', i + 1);
    return gifts;
  },
};

// =====================================================================
//  BASE: what every scene shares (cameras, notes with help, story pages, the hero, the ship, coins)
// =====================================================================
class Base extends Phaser.Scene {
  has(k) { return this.textures.exists(k); }
  // a repeating ground / sea; the Nano Banana tiles (512 px) are shown at half size, like the 256 px drawings
  tile(x, y, w, h, key) {
    const t = this.add.tileSprite(x, y, w, h, key), src = this.textures.get(key).getSourceImage();
    if (src.width > 300) t.setTileScale(256 / src.width);
    return t;
  }
  fit(o, w, h) { o.setScale(Math.min(w / o.width, h / o.height)); return o; }
  // a picture: the first art key that exists, or else the emoji
  pic(keys, emoji, x, y, size) {
    const k = [].concat(keys || []).find(k => k && this.has(k));
    if (k) return this.fit(this.add.image(x, y, k), size, size);
    return this.add.text(x, y, emoji, { fontSize: Math.round(size * 0.8) }).setOrigin(0.5);
  }

  setup(ww, wh, title) {
    this.ww = ww; this.wh = wh; this.busyStory = false; this.cur = null;
    makeVoyageTextures(this);
    this.physics.world.setBounds(0, 0, ww, wh);
    this.cameras.main.setBounds(0, 0, ww, wh).setZoom(HD).centerOn(Math.min(W / 2, ww / 2), Math.min(H / 2, wh / 2));
    this.uiCam = this.cameras.add(0, 0, Math.round(W * HD), Math.round(H * HD)).setOrigin(0, 0).setZoom(HD);
    this.keys = this.input.keyboard.addKeys({ left: 'LEFT', right: 'RIGHT', up: 'UP', down: 'DOWN', a: 'A', d: 'D', w: 'W', s: 'S',
      space: 'SPACE', enter: 'ENTER', r: 'R', one: 'ONE', two: 'TWO', three: 'THREE' });
    this.input.keyboard.on('keydown-ESC', goToCamp);
    this.sparks = this.add.particles(0, 0, 'soft', { speed: { min: 60, max: 200 }, lifespan: 650, scale: { start: 1.4, end: 0 }, tint: [0xffd43b, 0xfff3a0, 0xffffff], blendMode: 'ADD', emitting: false }).setDepth(3000);
    this.hud(title);
  }

  hud(title) {
    const d = 5000, fix = o => o.setScrollFactor(0).setDepth(d);
    fix(this.add.graphics()).fillStyle(0x2b1a0a).fillRoundedRect(18, 21, 130, 46, 23).fillStyle(0xfff8e6).fillRoundedRect(18, 16, 130, 46, 23).lineStyle(4, 0x2b1a0a).strokeRoundedRect(18, 16, 130, 46, 23);
    fix(this.add.image(44, 39, 'coin'));
    this.coinText = fix(this.add.text(68, 22, String(Save.get().coins), { fontFamily: 'Nunito', fontSize: 27, fontStyle: '900', color: '#2b1a0a' }));
    this.placeText = fix(this.add.text(W - 20, H - 54, title || '', { fontFamily: 'Cinzel', fontSize: 24, fontStyle: '900', color: '#fff8e6', stroke: '#2b1a0a', strokeThickness: 6 }).setOrigin(1, 1));
    fix(this.add.text(W - 20, H - 16, '⌂ Camp', { fontFamily: 'Nunito', fontSize: 22, fontStyle: '900', color: '#fff8e6', stroke: '#2b1a0a', strokeThickness: 6 }).setOrigin(1, 1))
      .setInteractive({ useHandCursor: true }).on('pointerdown', goToCamp);
    // the note (top): who says it, the sentence, help after mistakes (🔊 after one, Hebrew after two)
    this.noteBg = fix(this.add.graphics());
    this.notePic = null;
    this.noteWho = fix(this.add.text(W / 2 - 360, 30, '', { fontFamily: 'Cinzel', fontSize: 18, fontStyle: '900', color: '#7b4a1a' }).setOrigin(0, 0.5));
    this.noteText = fix(this.add.text(W / 2 + 40, 74, '', { fontFamily: 'Nunito', fontSize: 30, fontStyle: '900', color: '#2b1a0a', align: 'center', wordWrap: { width: 800 }, lineSpacing: 4 }).setOrigin(0.5));
    this.noteHe = fix(this.add.text(W / 2, 150, '', { fontFamily: 'Nunito', fontSize: 26, fontStyle: '900', color: '#ffe066', stroke: '#2b1a0a', strokeThickness: 6, align: 'center' }).setOrigin(0.5, 0).setVisible(false));
    this.listen = fix(this.add.text(W / 2 + 480, 74, '🔊', { fontSize: 34, backgroundColor: '#fff8e6', padding: { x: 6, y: 2 } }).setOrigin(0.5)).setVisible(false)
      .setInteractive({ useHandCursor: true }).on('pointerdown', () => this.readAloud());
    // a second, smaller note (the Sirens' tricks, a message in a bottle)
    this.note2Bg = fix(this.add.graphics()); this.note2Pic = null;
    this.note2Text = fix(this.add.text(W / 2 + 30, 0, '', { fontFamily: 'Nunito', fontSize: 25, fontStyle: '900', color: '#5a1040', align: 'center', wordWrap: { width: 640 } }).setOrigin(0.5));
    this.tip = this.add.text(0, 0, 'SPACE', { fontFamily: 'Nunito', fontSize: 22, fontStyle: '900', color: '#ffffff', backgroundColor: '#7b5cd6', padding: { x: 10, y: 3 } }).setOrigin(0.5).setDepth(4000).setVisible(false);
  }

  // show a note: { en, he, who }
  note(en, he, who = 'odysseus') { this.cur = { en, he, who, mistakes: 0 }; this.drawNote(true); }
  drawNote(pop) {
    const n = this.cur;
    if (!n) { this.noteBg.clear(); this.noteText.setText(''); this.noteWho.setText(''); this.noteHe.setVisible(false); this.listen.setVisible(false); if (this.notePic) this.notePic.destroy(); this.notePic = null; return; }
    this.noteText.setText(n.en);
    const h = Math.max(96, this.noteText.height + 44), top = 74 - h / 2 + 6;
    const fill = n.who === 'siren' ? 0xffd6ec : n.who === 'athena' ? 0xe3f0ff : n.who === 'bottle' ? 0xe8fff0 : 0xfff3d6;
    this.noteBg.clear().fillStyle(0x2b1a0a).fillRoundedRect(W / 2 - 470, top + 6, 940, h, 18).fillStyle(fill).fillRoundedRect(W / 2 - 470, top, 940, h, 18).lineStyle(5, 0x2b1a0a).strokeRoundedRect(W / 2 - 470, top, 940, h, 18);
    this.noteText.setY(top + h / 2 + 4);
    if (this.notePic) this.notePic.destroy();
    const wh = WHO[n.who] || WHO.log;
    this.notePic = this.pic(wh[0], wh[1], W / 2 - 418, top + h / 2, 70).setScrollFactor(0).setDepth(5001);
    this.noteWho.setText(wh[2] ? wh[2] + ':' : '').setY(top + 16);
    this.noteHe.setText(n.he).setY(top + h + 14).setVisible(n.mistakes >= 2);
    this.listen.setVisible(n.mistakes >= 1).setY(top + h / 2);
    if (pop) { this.tweens.add({ targets: this.noteText, scale: { from: 0.85, to: 1 }, duration: 250, ease: 'Back.out' }); sfx.page(); }
  }
  clearNote() { this.cur = null; this.drawNote(); }
  note2(en, who) {
    if (this.note2Pic) this.note2Pic.destroy(); this.note2Pic = null;
    if (!en) { this.note2Bg.clear(); this.note2Text.setText(''); return; }
    this.note2Text.setText(en).setColor(who === 'siren' ? '#5a1040' : '#1d4d2a');
    const top = 158 + (this.cur && this.cur.mistakes >= 2 ? 44 : 0), h = this.note2Text.height + 30;
    this.note2Bg.clear().fillStyle(0x2b1a0a).fillRoundedRect(W / 2 - 360, top + 5, 720, h, 16).fillStyle(who === 'siren' ? 0xffc2e2 : 0xd8f5dd).fillRoundedRect(W / 2 - 360, top, 720, h, 16).lineStyle(4, 0x2b1a0a).strokeRoundedRect(W / 2 - 360, top, 720, h, 16);
    this.note2Text.setY(top + h / 2);
    const wh = WHO[who] || WHO.log;
    this.note2Pic = this.pic(wh[0], wh[1], W / 2 - 320, top + h / 2, 52).setScrollFactor(0).setDepth(5001);
  }
  // a mistake: same note again, now with help
  miss(msg, x, y, onScreen) {
    if (this.cur) { this.cur.mistakes++; this.drawNote(false); }
    sfx.wrong(); this.cameras.main.shake(120, 0.004);
    if (msg) this.floatText(msg, x ?? W / 2, y ?? H / 2, '#ff9b9b', 28, onScreen ?? x === undefined);
  }
  readAloud() { if (this.cur) say(this.cur.en); }

  floatText(txt, x, y, color = '#ffe066', size = 30, onScreen = false) {
    const t = this.add.text(x, y, txt, { fontFamily: 'Nunito', fontSize: size, fontStyle: '900', color, stroke: '#2b1a0a', strokeThickness: 6, align: 'center' }).setOrigin(0.5).setDepth(onScreen ? 7000 : 4500);
    if (onScreen) t.setScrollFactor(0);
    this.tweens.add({ targets: t, y: y - 70, alpha: { from: 1, to: 0 }, duration: 1500, ease: 'Quad.out', onComplete: () => t.destroy() });
    return t;
  }
  addCoins(n, x, y) {
    for (let k = 0; k < n; k++) this.time.delayedCall(k * 70, () => { const c = Save.addCoins(1); this.coinText.setText(String(c)); sfx.coin(); });
    if (x !== undefined) this.sparks.explode(10 + n * 2, x, y);
  }
  banner(title, sub) {
    const t = this.add.text(W / 2, 300, title, { fontFamily: 'Cinzel', fontSize: 78, fontStyle: '900', color: '#ffd43b', stroke: '#6b4400', strokeThickness: 10, align: 'center' }).setOrigin(0.5).setDepth(8000).setScrollFactor(0);
    const s = this.add.text(W / 2, 390, sub || '', { fontFamily: 'Nunito', fontSize: 34, fontStyle: '900', color: '#fff', stroke: '#2b1a0a', strokeThickness: 7 }).setOrigin(0.5).setDepth(8000).setScrollFactor(0);
    this.tweens.add({ targets: [t, s], scale: { from: 0.4, to: 1 }, duration: 400, ease: 'Back.out' });
    this.tweens.add({ targets: [t, s], alpha: 0, delay: 1700, duration: 400, onComplete: () => { t.destroy(); s.destroy(); } });
  }

  // ---------- story pages: a picture of who speaks and one or two sentences; SPACE / ENTER / the button for the next page ----------
  story(pages, done) {
    this.busyStory = true; this.tip.setVisible(false);
    let i = 0;
    const o = this.add.container(0, 0).setDepth(9000);
    const add = obj => { o.add(obj); return obj; };
    add(this.add.rectangle(W / 2, H / 2, W, H, 0x050f1e, 0.78).setInteractive());
    add(this.add.graphics()).fillStyle(0x2b1a0a).fillRoundedRect(150, 170, 980, 390, 26).fillStyle(0xfff3d6).fillRoundedRect(150, 162, 980, 390, 26).lineStyle(6, 0x2b1a0a).strokeRoundedRect(150, 162, 980, 390, 26);
    add(this.add.graphics()).fillStyle(0xf6dca0).fillCircle(330, 340, 125).lineStyle(5, 0x2b1a0a).strokeCircle(330, 340, 125);
    const name = add(this.add.text(330, 490, '', { fontFamily: 'Cinzel', fontSize: 24, fontStyle: '900', color: '#7b4a1a' }).setOrigin(0.5));
    const text = add(this.add.text(800, 330, '', { fontFamily: 'Nunito', fontSize: 38, fontStyle: '900', color: '#2b1a0a', align: 'center', wordWrap: { width: 560 }, lineSpacing: 6 }).setOrigin(0.5));
    const he = add(this.add.text(800, 470, '', { fontFamily: 'Nunito', fontSize: 26, fontStyle: '900', color: '#9a5a10', align: 'center', wordWrap: { width: 560 } }).setOrigin(0.5).setVisible(false));
    const small = (x, label, fn) => { const t = add(this.add.text(x, 520, label, { fontFamily: 'Nunito', fontSize: 24, fontStyle: '900', color: '#2b1a0a', backgroundColor: '#f0e2c4', padding: { x: 10, y: 4 } }).setOrigin(0.5)); t.setInteractive({ useHandCursor: true }).on('pointerdown', fn); return t; };
    small(560, '🔊', () => say(pages[i].en, voyVoice(pages[i])));
    small(650, 'עברית', () => he.setVisible(!he.visible));
    const btn = add(this.add.container(1010, 600));
    btn.add([this.add.graphics().fillStyle(0x2b1a0a).fillRoundedRect(-110, -26, 220, 62, 31).fillStyle(0xffd43b).fillRoundedRect(-110, -32, 220, 62, 31).lineStyle(4, 0x2b1a0a).strokeRoundedRect(-110, -32, 220, 62, 31),
             this.add.text(0, -2, 'Next ▶', { fontFamily: 'Cinzel', fontSize: 28, fontStyle: '900', color: '#2b1a0a' }).setOrigin(0.5)]);
    btn.setSize(220, 62).setInteractive({ useHandCursor: true }).on('pointerdown', () => next());
    let picObj = null;
    const show = () => {
      const p = pages[i], wh = WHO[p.who] || WHO.log;
      if (picObj) picObj.destroy();
      picObj = add(this.pic(p.pic ? [p.pic] : wh[0], p.emoji || wh[1], 330, 340, 210));
      name.setText(wh[2]); text.setText(p.en); he.setText(p.he).setVisible(false);
      [o, btn, ...o.list, ...btn.list].forEach(c => c.setScrollFactor(0));
      this.tweens.add({ targets: text, alpha: { from: 0, to: 1 }, duration: 250 });
      sfx.page();
    };
    const next = () => {
      if (!o.active) return;
      i++;
      if (i >= pages.length) { o.destroy(); this.storyNext = null; this.time.delayedCall(60, () => { this.busyStory = false; done && done(); }); }
      else show();
    };
    this.storyNext = next;
    show();
  }

  // ---------- a choice of answers (buttons, or keys 1-3) ----------
  choice(question, who, options, onPick) {
    this.busyStory = true;
    const o = this.add.container(0, 0).setDepth(9000);
    o.add(this.add.rectangle(W / 2, H / 2, W, H, 0x050f1e, 0.6).setInteractive());
    const wh = WHO[who];
    o.add(this.add.graphics().fillStyle(0x2b1a0a).fillRoundedRect(200, 196, 880, 130, 22).fillStyle(0xfff3d6).fillRoundedRect(200, 190, 880, 130, 22));
    o.add(this.pic(wh[0], wh[1], 270, 255, 100));
    o.add(this.add.text(680, 255, question, { fontFamily: 'Nunito', fontSize: 34, fontStyle: '900', color: '#2b1a0a', align: 'center', wordWrap: { width: 680 } }).setOrigin(0.5));
    const done = i => { if (!o.active) return; o.destroy(); this.choiceKeys = null; this.time.delayedCall(60, () => { this.busyStory = false; onPick(i); }); };
    options.forEach((t, i) => {
      const b = this.add.container(W / 2, 400 + i * 86);
      b.add([this.add.graphics().fillStyle(0x2b1a0a).fillRoundedRect(-300, -28, 600, 64, 20).fillStyle(0x9bd8ff).fillRoundedRect(-300, -34, 600, 64, 20).lineStyle(4, 0x2b1a0a).strokeRoundedRect(-300, -34, 600, 64, 20),
             this.add.text(0, -2, `${i + 1}.  ${t}`, { fontFamily: 'Nunito', fontSize: 30, fontStyle: '900', color: '#2b1a0a' }).setOrigin(0.5)]);
      b.setSize(600, 64).setInteractive({ useHandCursor: true }).on('pointerdown', () => done(i)).on('pointerover', () => b.setScale(1.04)).on('pointerout', () => b.setScale(1));
      o.add(b); b.list.forEach(c => c.setScrollFactor(0)); b.setScrollFactor(0);
    });
    o.list.forEach(c => c.setScrollFactor(0)); o.setScrollFactor(0);
    this.choiceKeys = done;
  }

  // ---------- the end of an island: progress, gift cards, then back to the sea ----------
  finishIsland(i, after) {
    this.clearNote(); this.note2(null);
    const gifts = Voyage.finish(i);
    sfx.win(); this.banner('Well done!', VOY_ISLANDS[i][1]);
    this.addCoins(10);
    const showGift = k => {
      if (k >= gifts.length) return after ? after() : this.time.delayedCall(300, () => this.cameras.main.fadeOut(400)) && this.time.delayedCall(750, () => this.scene.start('Sea', { from: i }));
      const c = CARDS.find(c => c[0] === gifts[k]);
      const o = this.add.container(0, 0).setDepth(9500);
      o.add(this.add.rectangle(W / 2, H / 2, W, H, 0x050f1e, 0.78).setInteractive());
      o.add(this.add.text(W / 2, 110, 'A new card for your album!', { fontFamily: 'Cinzel', fontSize: 40, fontStyle: '900', color: '#ffd43b', stroke: '#6b4400', strokeThickness: 8 }).setOrigin(0.5));
      o.add(this.add.graphics().fillStyle(0x2b1a0a).fillRoundedRect(W / 2 - 150, 160, 300, 400, 22).fillStyle(c[2] === 'monster' ? 0x8e44ad : 0x2f9e44).fillRoundedRect(W / 2 - 146, 156, 292, 396, 20).fillStyle(0xfff8e6).fillRoundedRect(W / 2 - 130, 172, 260, 230, 14));
      o.add(this.pic(['card_' + c[0]], c[3], W / 2, 287, 210));
      o.add(this.add.text(W / 2, 430, c[1], { fontFamily: 'Cinzel', fontSize: 30, fontStyle: '900', color: '#fff8e6', stroke: '#2b1a0a', strokeThickness: 6 }).setOrigin(0.5));
      o.add(this.add.text(W / 2, 495, c[4], { fontFamily: 'Nunito', fontSize: 17, fontStyle: '900', color: '#fff8e6', align: 'center', wordWrap: { width: 260 } }).setOrigin(0.5));
      o.add(this.add.text(W / 2, 620, 'SPACE ▶', { fontFamily: 'Nunito', fontSize: 26, fontStyle: '900', color: '#fff8e6' }).setOrigin(0.5));
      o.list.forEach(x => x.setScrollFactor(0)); o.setScrollFactor(0);
      o.setAlpha(0); this.tweens.add({ targets: o, alpha: 1, duration: 300 });
      sfx.good();
      this.busyStory = true;
      this.storyNext = () => { o.destroy(); this.storyNext = null; this.busyStory = false; showGift(k + 1); };
    };
    this.time.delayedCall(1900, () => showGift(0));
  }

  // keys for story pages and choices; returns true while one of them is open
  baseUpdate() {
    hdTick(this, this.uiCam);
    const k = this.keys, J = Phaser.Input.Keyboard.JustDown;
    if (this.choiceKeys) { [k.one, k.two, k.three].forEach((key, i) => { if (J(key)) this.choiceKeys(i); }); return true; }
    if (this.storyNext) { if (J(k.space) || J(k.enter)) this.storyNext(); return true; }
    if (this.cur && this.cur.mistakes >= 1 && J(k.r)) this.readAloud();
    return this.busyStory;
  }

  // ---------- the hero, walking (seen from above) ----------
  makeHero(x, y) {
    this.player = this.physics.add.image(x, y, 'px').setVisible(false);
    this.player.body.setSize(34, 26).setCollideWorldBounds(true);
    this.animated = this.has('hero_walk');
    if (this.animated && !this.anims.exists('hero_down'))

  if (scene.textures.exists(`v_pig_${color}_${act}`)) return canvasTex(scene, `pig_${color}_${scarf || 'none'}_${act}`, 170, 120, (x) => {
    const r = drawFit(x, scene, `v_pig_${color}_${act}`, 170, 120);
    if (scarf) {
      // where the head meets the body (measured on the pictures): standing pigs and lying pigs
      // [top x, top y, bottom x, bottom y]: from behind the ear down to under the chin
      const [t0, f0, b0, f1] = act === 'sleep' ? [0.52, 0.46, 0.60, 0.80] : [0.50, 0.33, 0.60, 0.66];
      const c = '#' + colorOf(scarf)[1].toString(16).padStart(6, '0'), tx = r.x + r.w * t0, top = r.y + r.h * f0, nx = r.x + r.w * b0, bot = r.y + r.h * f1, bw = r.w * 0.085;
      neckBand(x, tx, top, nx, bot, bw, c);
      // the knot in front, and two ends hanging down
      x.lineJoin = 'round'; x.lineWidth = 2.5; x.strokeStyle = OUT;
      [[-0.6, 1.0], [0.5, 0.85]].forEach(([dx, len]) => {
        const x0 = nx + bw * 0.2, y0 = bot - bw * 0.2, x1 = x0 + dx * bw * 1.1, y1 = y0 + len * bw * 1.8;
        x.beginPath(); x.moveTo(x0 - bw * 0.45, y0); x.lineTo(x1 - bw * 0.45, y1); x.lineTo(x1 + bw * 0.45, y1); x.lineTo(x0 + bw * 0.45, y0); x.closePath();
        x.fillStyle = c; x.fill(); x.stroke();
        x.beginPath(); for (let k = -1; k <= 1; k++) { x.moveTo(x1 + k * bw * 0.25, y1); x.lineTo(x1 + k * bw * 0.25, y1 + bw * 0.4); } x.stroke();
      });
      blob(x, nx + bw * 0.2, bot - bw * 0.15, bw * 0.55, bw * 0.45, c, OUT, 2.5);
    }
  });
  return canvasTex(scene, `pig_${color}_${scarf || 'none'}_${act}`, 170, 120, (x) => {
    if (act === 'mud') blob(x, 80, 98, 76, 18, '#6b4a2b', null);
    const bc = color === 'brown' ? '#b0703f' : '#f7a6b8';
    [[44, 96], [66, 98], [96, 98], [116, 96]].forEach(([lx, ly]) => { x.fillStyle = OUT; x.fillRect(lx - 6, ly - 24, 12, 24); x.fillStyle = bc; x.fillRect(lx - 3, ly - 22, 6, 20); });
    blob(x, 80, 64, 56, 34, bc);
    if (color === 'spotted') [[60, 52], [92, 70], [72, 80], [104, 50]].forEach(([sx, sy]) => blob(x, sx, sy, 10, 7, '#8a5a30', null));
    blob(x, 134, 54, 26, 24, bc); blob(x, 128, 30, 8, 10, bc, OUT, 3);
    blob(x, 156, 60, 10, 8, '#e88aa0', OUT, 3); blob(x, 153, 59, 1.6, 2.2, OUT, null); blob(x, 159, 59, 1.6, 2.2, OUT, null);
    if (act === 'sleep') { x.strokeStyle = OUT; x.lineWidth = 3; x.beginPath(); x.moveTo(134, 48); x.lineTo(142, 48); x.stroke(); x.fillStyle = '#3b82f6'; x.font = '900 20px Nunito'; x.fillText('z z', 130, 22); }
    else blob(x, 139, 47, 3.5, 3.5, OUT, null);
    if (scarf) {   // a wide scarf around the neck with two ends hanging down
      const c = '#' + colorOf(scarf)[1].toString(16).padStart(6, '0');
      x.lineJoin = 'round';
      const band = () => { x.beginPath(); x.moveTo(104, 34); x.quadraticCurveTo(118, 30, 124, 40); x.lineTo(122, 86); x.quadraticCurveTo(112, 92, 100, 86); x.closePath(); };
      x.fillStyle = c; band(); x.fill(); x.lineWidth = 3; x.strokeStyle = OUT; x.stroke();
      [[100, 80, 88, 108], [108, 82, 104, 112]].forEach(([a1, b1, a2, b2]) => { x.beginPath(); x.moveTo(a1, b1); x.lineTo(a2, b2); x.lineTo(a2 + 12, b2 + 2); x.lineTo(a1 + 12, b1); x.closePath(); x.fillStyle = c; x.fill(); x.stroke(); });
      x.strokeStyle = 'rgba(255,255,255,.45)'; x.lineWidth = 3; x.beginPath(); x.moveTo(108, 44); x.lineTo(110, 80); x.stroke();
    }
    if (act === 'apple') { blob(x, 158, 82, 11, 11, '#e84545'); x.fillStyle = '#3fbf6f'; x.fillRect(157, 68, 4, 6); }
    x.strokeStyle = OUT; x.lineWidth = 3; x.beginPath(); x.moveTo(24, 58); x.quadraticCurveTo(12, 50, 18, 42); x.stroke();
  });
}
// a plant in the soil: flower on top, root under the ground
function plantTex(scene, flower, root) {
  const FC = { white: '#ffffff', yellow: '#ffd43b', red: '#e84545', purple: '#9b5de5' }, RC = { black: '#1a1a1a', brown: '#8a5a30', orange: '#ff8a1f' };
  // the Nano Banana flower, with the (white) root coloured and drawn under the soil
  if (scene.textures.exists('v_flower_' + flower)) return canvasTex(scene, `plant_${flower}_${root}`, 80, 140, (x) => {
    if (scene.textures.exists('v_root')) { const src = scene.textures.get('v_root').getSourceImage(), h = 50, w = src.width * h / src.height; x.drawImage(tinted(src, root === 'black' ? '#3a3a3a' : RC[root], w, h), 40 - w / 2, 88, w, h); }
    drawFit(x, scene, 'v_flower_' + flower, 80, 100);
  });
  return canvasTex(scene, `plant_${flower}_${root}`, 80, 140, (x) => {
    blob(x, 40, 84, 36, 12, '#7a5230', OUT, 3);
    x.strokeStyle = RC[root]; x.lineWidth = 6; x.lineCap = 'round';
    [[40, 86, 40, 132], [40, 100, 24, 124], [40, 100, 58, 126]].forEach(([a, b, c, d]) => { x.beginPath(); x.moveTo(a, b); x.lineTo(c, d); x.stroke(); });
    x.strokeStyle = '#3f8a3a'; x.lineWidth = 5; x.beginPath(); x.moveTo(40, 84); x.lineTo(40, 34); x.stroke();
    blob(x, 30, 60, 10, 5, '#5fbf4a', OUT, 2); blob(x, 50, 52, 10, 5, '#5fbf4a', OUT, 2);
    for (let k = 0; k < 6; k++) { const a = k / 6 * Math.PI * 2; blob(x, 40 + Math.cos(a) * 11, 26 + Math.sin(a) * 11, 9, 9, FC[flower], OUT, 2.5); }
    blob(x, 40, 26, 6, 6, '#ffb000', OUT, 2);
  });
}

    const start = done === 0 || done >= 6 ? [230, 1430] : [ISLES[done - 1][0] + ISLES[done - 1][2] + 70, ISLES[done - 1][1] + 40];
    this.ship = this.makeShip(start[0], start[1]);

          for (let k = 0; k < 9; k++) { const c = this.add.ellipse(x - 70 + (k % 3) * 70, y - 30 + Math.floor(k / 3) * 60, 170, 100, 0x3a3f4d, 0.88).setDepth(8); if (done >= 6) c.setVisible(false); this.tweens.add({ targets: c, x: c.x + 14, duration: 1800 + k * 120, yoyo: true, repeat: -1, ease: 'Sine.inOut' }); } }

      if (!seen[f] && this.has('v_rock_' + f)) { this.add.image(x, y - 20, 'v_rock_' + f).setScale(0.9).setDepth(6); seen[f] = true; return; }

  // after an island: a bottle with a message floats near the ship
  dropBottle() {

    this.tweens.add({ targets: this.bottle, y: this.bottle.y - 8, angle: 8, duration: 900, yoyo: true, repeat: -1, ease: 'Sine.inOut' });

  }
  update(time, delta) {
    if (this.baseUpdate()) { this.ship.setVelocity(0, 0); return; }

    let vx = 0, vy = 0;
    if (k.left.isDown || k.a.isDown) vx -= 1; if (k.right.isDown || k.d.isDown) vx += 1;
    if (k.up.isDown || k.w.isDown) vy -= 1; if (k.down.isDown || k.s.isDown) vy += 1;
    const len = Math.hypot(vx, vy) || 1;
    this.ship.setVelocity(vx / len * 250, vy / len * 250);
    if (vx || vy) { const target = Math.atan2(vy, vx) * 180 / Math.PI + 90; this.ship.angle += Phaser.Math.Angle.ShortestBetween(this.ship.angle, target) * 0.15; }
    // the bottle
    if (this.bottle && Phaser.Math.Distance.Between(this.ship.x, this.ship.y, this.bottle.x, this.bottle.y) < 70) {
      this.quest = this.bottle.quest; this.bottle.destroy(); this.bottle = null; sfx.splash();
      this.note2(this.quest[1], 'bottle');
    }
    // the gold rocks
    if (this.quest) for (const r of this.rocks) {
      if (Phaser.Math.Distance.Between(this.ship.x, this.ship.y, r.x, r.y) < 110 && !r.tried) {
        r.tried = true; this.time.delayedCall(1500, () => r.tried = false);
        if (r.f === this.quest[0]) { this.floatText('You found the gold!', r.x, r.y - 60, '#ffe066', 32); this.addCoins(10, r.x, r.y); this.quest = null; this.note2(null); }
        else this.floatText('No gold here. Read the message again.', r.x, r.y - 60, '#fff8e6', 24);
      }
    }
    // islands
    let near = null;
    for (const isl of this.isles) if (Phaser.Math.Distance.Between(this.ship.x, this.ship.y, isl.x, isl.y) < isl.r + 110) near = isl;
    this.tip.setVisible(!!near); if (near) this.tip.setPosition(this.ship.x, this.ship.y - 100);

  }
  dock(i) {

    if (i === done || done >= 6) { this.cameras.main.fadeOut(400); this.time.delayedCall(450, () => this.scene.start(VOY_ISLANDS[i][0])); }
    else if (i < done) this.floatText('You were here already!', this.ship.x, this.ship.y - 120, '#fff8e6', 28);
    else this.miss('Not this island! Read again.', this.ship.x, this.ship.y - 120, false);
  }
}

// =====================================================================
//  1. THE LOTUS ISLAND: find the sailors from their description; do not step on the lotus flowers
// =====================================================================
const LOTUS_LM = [['big rock', 'הסלע הגדול', 'rock', 300, 300], ['palm tree', 'עץ הדקל', 'palm', 980, 270], ['pond', 'הבריכה', 'pond', 330, 540], ['old boat', 'הסירה הישנה', 'boat', 960, 560]];
class Lotus extends Base {
  constructor() { super('Lotus'); }
  create() {
    this.setup(W, H, 'The Lotus Island');
    this.tile(W / 2, H / 2, W, H, 'sand');
    this.tile(W / 2, H - 30, W, 60, 'sea').setDepth(1);
    this.add.image(W / 2, H - 50, 'ship').setAngle(90).setDepth(2);
    LOTUS_LM.forEach(([, , tex, x, y]) => this.add.image(x, y, tex).setDepth(y + 30).setScale(tex === 'palm' ? 0.9 : 0.85));
    this.makeSailors();
    this.makeHero(W / 2, H - 140);
    this.round = 0;
    this.story(VOY_STORY.Lotus, () => this.nextRound());
    window.voyage = this;
  }
  makeSailors() {
    for (let tries = 0; tries < 400; tries++) {
      const hats = shuffle(COLORS.map(c => c[0])), lms = shuffle([0, 1, 2, 3, pick([0, 1, 2, 3])]);
      const sailors = lms.map((lm, n) => ({ hat: hats[n], item: pick(ITEMS)[0], lm }));
      // the rounds must each find exactly one sailor
      const plan = [], left = sailors.slice();
      let ok = true;
      for (let r = 0; r < 5 && ok; r++) {
        const t = this.task(r, left); if (!t) ok = false; else { plan.push(t); left.splice(left.indexOf(t.target), 1); }
      }
      if (!ok) continue;
      this.plan = plan;
      const used = {};
      sailors.forEach(s => {
        const L = LOTUS_LM[s.lm], side = used[s.lm] ? 1 : -1; used[s.lm] = true;
        const sx = L[3] + side * 120, sy = L[4] + 40;
        Object.assign(s, this.sailor(sx, sy, s.hat, s.item));
      });
      this.sailors = sailors;
      sailors.forEach(sl => this.roam(sl, 60, 35));
      // lotus patches, not too close to anything
      this.patches = [];

  // the note for each round; keys must point at exactly one sailor
  task(r, left) {

      { keys: ['hat'], en: s => `Find the sailor with the ${s.hat} hat.`, he: s => `מצאי את המלח עם הכובע ${colorOf(s.hat)[3]}.` },
      { keys: ['item'], en: s => `Find the sailor with ${aAn(s.item)}.`, he: s => `מצאי את המלח עם ה${ITEMS.find(i => i[0] === s.item)[1]}.` },
      { keys: ['hat', 'item'], en: s => `Find the sailor with ${aAn(s.hat)} hat and ${aAn(s.item)}.`, he: s => `מצאי את המלח עם כובע ${colorOf(s.hat)[3].slice(1)} ו${ITEMS.find(i => i[0] === s.item)[1]}.` },
      { keys: ['lm'], en: s => `Find the sailor next to the ${LOTUS_LM[s.lm][0]}.`, he: s => `מצאי את המלח שליד ${LOTUS_LM[s.lm][1]}.` },
      { keys: ['lm', 'item'], en: s => `This sailor sits next to the ${LOTUS_LM[s.lm][0]}. He has ${aAn(s.item)}.`, he: s => `המלח הזה יושב ליד ${LOTUS_LM[s.lm][1]}. יש לו ${ITEMS.find(i => i[0] === s.item)[1]}.` },
    ];
    const tpl = T[r];
    const fits = shuffle(left).filter(s => left.filter(o => tpl.keys.every(k => o[k] === s[k])).length === 1);
    if (!fits.length) return null;
    const s = fits[0];

  }
  nextRound() {
    if (this.round >= 5) return this.story(VOY_STORY.LotusEnd, () => this.finishIsland(0));
    const t = this.plan[this.round];

  use(s) {

      this.floatText(this.cur.mistakes ? 'Thank you!' : 'Perfect! Thank you!', s.x, s.y - 70, '#ffe066', 30);

      this.tweens.add({ targets: [...s.parts], x: `+=${W / 2 - s.x}`, y: `+=${H - 60 - s.y}`, alpha: 0, duration: 1100, ease: 'Quad.in' });

      this.floatText('Lotus... so sweet...', s.x, s.y - 70, '#ffb3d9', 24);

  update() {
    const busy = this.baseUpdate();
    this.moveHero(!busy);
    if (busy) return;
    this.heroSlow = Math.max(0, this.heroSlow - this.game.loop.delta / 1000);
    // the lotus flowers make you forget: she gets slow and dizzy for a moment
    for (const p of this.patches) if (this.heroSlow <= 0 && Phaser.Math.Distance.Between(p.x, p.y, this.player.x, this.player.y + 10) < 38) {
      this.heroSlow = 2.5; this.heroDizzy = true; sfx.wrong(); this.floatText('Do not eat the flowers!', this.player.x, this.player.y - 100, '#ffb3d9', 26);
      this.tweens.add({ targets: this.heroImg, angle: { from: -12, to: 12 }, duration: 220, yoyo: true, repeat: 4, onComplete: () => this.heroImg.setAngle(0) });
    }
    const n = this.nearest(this.sailors);
    if (n && Phaser.Input.Keyboard.JustDown(this.keys.space)) this.use(n);
  }
}

      { keys: ['head'], en: s => `Hide the next sailor under the big sheep with a ${s.head} head.`, he: s => `החביאי את המלח הבא מתחת לכבשה הגדולה עם הראש ה${s.head === 'black' ? 'שחור' : 'לבן'}.` },
      { keys: ['wool'], en: s => `This big sheep has ${s.wool} wool. Hide a sailor under it.`, he: s => `לכבשה הגדולה הזאת יש צמר ${s.wool === 'white' ? 'לבן' : 'אפור'}. החביאי מלח מתחתיה.` },
      { keys: ['wool', 'head'], en: s => `Now it is your turn! Hide under the big ${s.wool} sheep with a ${s.head} head.`, he: s => `עכשיו תורך! התחבאי מתחת לכבשה הגדולה ה${s.wool === 'white' ? 'לבנה' : 'אפורה'} עם הראש ה${s.head === 'black' ? 'שחור' : 'לבן'}.` },

  }
  use(s) {
    const t = this.plan[this.round];
    if (s !== t.target) return this.miss(s.size === 'small' ? 'This sheep is too small!' : 'Not this sheep! Read again.');
    sfx.good(); this.tip.setVisible(false); this.busyStory = true;
    this.tweens.killTweensOf(s); s.busy = true; s.gone = true;
    this.addCoins(this.cur.mistakes ? 2 : 4, s.x, s.y - 40);

    const walkOut = () => {
      s.img.setFlipX(false);
      this.tweens.add({ targets: s, x: this.exit.x, y: this.exit.y + 60, duration: 1600, onUpdate: () => s.img.setPosition(s.x, s.y).setDepth(s.y + 30), onComplete: () => {
        this.tweens.add({ targets: this.cyc, angle: { from: -6, to: 6 }, duration: 160, yoyo: true, repeat: 2 });

        this.tweens.add({ targets: s.img, y: this.exit.y - 40, alpha: 0, duration: 700, delay: 600, onComplete: () => {
          this.round++; this.busyStory = false;

      } });

    else this.tweens.add({ targets: hider.parts, x: `+=${s.x - hider.x}`, y: `+=${s.y - hider.y}`, alpha: 0, duration: 800, onComplete: () => { hider.shade.destroy(); walkOut(); } });
  }

  watchCyclops(dt) {

    if (e.state === 'sleep' && e.t <= 0) { e.state = 'wake'; e.t = 1300; show('wake'); this.look.setText('The Cyclops is waking up!'); tone(200, 260, .3, 'sawtooth', .05); this.tweens.add({ targets: this.cyc, angle: { from: -4, to: 4 }, duration: 120, yoyo: true, repeat: 3 }); }
    else if (e.state === 'wake' && e.t <= 0) { e.state = 'watch'; e.t = Phaser.Math.Between(2200, 3400); this.look.setText('👁️  He is watching! Do not move!'); }
    else if (e.state === 'watch') {
      const moving = Math.hypot(this.player.body.velocity.x, this.player.body.velocity.y) > 20;
      if (moving && this.heroImg.visible) {   // seen! back to the corner (not a reading mistake)
        sfx.wrong(); this.cameras.main.shake(180, 0.006);
        this.floatText('I see you! Back to the corner!', this.cyc.x - 40, this.cyc.y + 150, '#ffb3b3', 28);
        this.poof(this.player.x, this.player.y - 30); this.player.setPosition(320, 600); this.player.setVelocity(0, 0);
        e.state = 'sleep'; e.t = Phaser.Math.Between(3500, 5500); show('sleep');
      } else if (e.t <= 0) { e.state = 'sleep'; e.t = Phaser.Math.Between(4000, 6500); show('sleep'); }
    }
    if (e.state === 'sleep') this.zzz.setAlpha(0.5 + Math.sin(this.time.now / 300) * 0.5);
  }
  update(time, delta) {
    const busy = this.baseUpdate();
    this.moveHero(!busy && this.heroImg.visible);
    if (!busy && this.plan && this.cur && this.round < 4) this.watchCyclops(delta); else { this.zzz.setVisible(false); this.look.setVisible(false); }
    if (busy || this.round >= 4 || !this.plan || this.cur === null) { if (busy) this.tip.setVisible(false); return; }
    const n = this.nearest(this.flock, 90);
    if (n && Phaser.Input.Keyboard.JustDown(this.keys.space)) this.use(n);
  }
}

// =====================================================================
//  3. CIRCE'S ISLAND: find the moly flower, then find each sailor among the pigs

const CIRCE_LM = [['old well', 'הבאר הישנה', 'well', 220, 430], ['big tree', 'העץ הגדול', 'tree', 470, 300], ['big rock', 'הסלע הגדול', 'rock', 640, 520]];
const PIG_NAMES = [['Elpenor', 'אלפנור'], ['Polites', 'פוליטס'], ['Eurylochus', 'אוריולוכוס'], ['Perimedes', 'פרימדס'], ['Baius', 'באיוס']];
const PIG_ACT = { sleep: ['sleeping', 'ישן'], apple: ['eating an apple', 'אוכל תפוח'], mud: ['in the mud', 'בבוץ'] };
const PIG_COLOR = { pink: ['pink', 'ורוד'], brown: ['brown', 'חום'], spotted: ['spotted', 'מנוקד'] };
class Circe extends Base {
  constructor() { super('Circe'); }
  create() {
    this.setup(W, H, "Circe's Island");

    this.add.image(170, 210, 'house').setScale(0.7).setDepth(250);

      if (tex === 'tree') this.pic([iconKey('tree')], '🌳', x, y, 170).setDepth(y + 40);

    });

    if (this.has('v_fence')) for (let x = this.pen.x + 50; x <= this.pen.x + this.pen.w; x += 100) { this.add.image(x, this.pen.y - 10, 'v_fence').setDepth(this.pen.y); this.add.image(x, this.pen.y + this.pen.h - 10, 'v_fence').setDepth(this.pen.y + this.pen.h); }
    else for (let x = this.pen.x; x <= this.pen.x + this.pen.w; x += 40) { this.add.image(x, this.pen.y, 'fence').setDepth(this.pen.y); this.add.image(x, this.pen.y + this.pen.h, 'fence').setDepth(this.pen.y + this.pen.h); }

    for (let y = this.pen.y; y <= this.pen.y + this.pen.h; y += 50) this.add.image(this.pen.x + this.pen.w, y, 'fence').setDepth(y);

  makePlants() {

    const list = [];

    list.forEach(p => { [p.flower, p.root] = others(); });
    const t = list.find(p => p.lm === lmT), o = list.find(p => p.lm === lmO);
    [t.flower, t.root, o.flower, o.root] = ['white', 'black', 'white', 'black'];
    this.plants = list.map(p => {
      const L = CIRCE_LM[p.lm], x = L[3] + p.side * 90, y = L[4] + 70;
      p.img = this.add.image(x, y, plantTex(this, p.flower, p.root)).setScale(0.8).setDepth(y + 20);
      p.x = x; p.y = y; p.spot = { x, y: y + 50 }; p.tipUp = 90;

  makePigs() {

      { keys: ['size', 'color'], en: (s, n) => `${n[0]} is a ${s.size} ${PIG_COLOR[s.color][0]} pig.`, he: (s, n) => `${n[1]} הוא חזיר ${s.size === 'big' ? 'גדול' : 'קטן'} ${PIG_COLOR[s.color][1]}.` },
      { keys: ['act', 'scarf'], need: s => s.scarf, en: (s, n) => `${n[0]} is ${PIG_ACT[s.act][0]}. He has ${aAn(s.scarf)} scarf.`, he: (s, n) => `${n[1]} ${PIG_ACT[s.act][1]}. יש לו צעיף ${colorOf(s.scarf)[3].slice(1)}.` },
      { keys: ['size', 'act'], en: (s, n) => `Find the ${s.size} pig. It is ${PIG_ACT[s.act][0]}.`, he: (s, n) => `מצאי את החזיר ה${s.size === 'big' ? 'גדול' : 'קטן'}. הוא ${PIG_ACT[s.act][1]}.` },
      { keys: ['color', 'act'], en: (s, n) => `${n[0]} is ${PIG_ACT[s.act][0]}. He is a ${PIG_COLOR[s.color][0]} pig.`, he: (s, n) => `${n[1]} ${PIG_ACT[s.act][1]}. הוא חזיר ${PIG_COLOR[s.color][1]}.` },
    ];
    const props = () => ({ size: pick(['big', 'small']), color: pick(['pink', 'brown', 'spotted']), scarf: Math.random() < 0.7 ? pick(COLORS)[0] : null, act: pick(['sleep', 'apple', 'mud']) });
    for (let tries = 0; tries < 3000; tries++) {
      const pigs = Array.from({ length: 5 }, props), left = pigs.slice(), plan = [];
      for (let r = 0; r < 5; r++) {
        const tpl = T[r];
        const fits = left.filter(s => (!tpl.need || tpl.need(s)) && left.filter(o => tpl.keys.every(k => o[k] === s[k])).length === 1);
        if (!fits.length) break;
        const s = pick(fits); plan.push({ target: s, name: PIG_NAMES[r], tpl }); left.splice(left.indexOf(s), 1);
      }
      if (plan.length < 5) continue;
      this.plan = plan.map(p => ({ target: p.target, en: p.tpl.en(p.target, p.name), he: p.tpl.he(p.target, p.name) }));
      const slots = shuffle([[870, 330], [1010, 310], [1150, 350], [920, 520], [1100, 560]]);
      this.pigs = pigs.map((s, n) => {

  usePlant(p) {

    sfx.good(); this.addCoins(this.cur.mistakes ? 2 : 4, p.x, p.y - 40); this.tip.setVisible(false);

// =====================================================================
//  4b. THE SIRENS, at sea: pass each big rock on the side Odysseus says, not the side the Sirens say
// =====================================================================
const ODY_SIDE = [ // Odysseus: s = the right side to sail, o = the other side
  [(s, o) => `Sail to the ${s} of the big rock.`, (s, o) => `הפליגי לצד ${LR_HE[s]} של הסלע הגדול.`],
  [(s, o) => `Go ${s}! The Sirens are on the ${o}.`, (s, o) => `סעי ${LR_TO[s]}! הסירנות בצד ${LR_HE[o]}.`],
  [(s, o) => `Keep the big rock on your ${o}.`, (s, o) => `השאירי את הסלע הגדול בצד ${LR_HE[o]} שלך.`],
  [(s, o) => `Turn ${s} now. Do not listen to the song!`, (s, o) => `פני ${LR_TO[s]} עכשיו. אל תקשיבי לשיר!`],
];
const SIREN_SIDE = [o => `Sail to the ${o}! We have cake!`, o => `Come to the ${o} side! Hear our song!`, o => `Go ${o}, brave sailor! It is safe here!`];
class SirensSea extends Base {
  constructor() { super('SirensSea'); }
  create() {
    const GATES = 6, GAP = 650;
    this.setup(W, GATES * GAP + 900, 'The Sirens');
    this.tile(W / 2, this.wh / 2, W, this.wh, 'sea');
    this.cx = W / 2;
    this.gates = Array.from({ length: GATES }, (_, i) => {
      const y = this.wh - 500 - i * GAP, side = pick(['left', 'right']), wrong = OPP[side];
      this.add.image(this.cx, y, 'rock').setScale(1.1).setDepth(10);
      // the Sirens sit on rocks on the wrong side
      const sx = this.cx + (wrong === 'left' ? -330 : 330);
      this.add.image(sx, y + 20, 'rock').setScale(0.7).setDepth(10);
      const sir = this.pic(['art_siren', 'art_harpy'], '🧜‍♀️', sx, y - 30, 110).setDepth(11);
      this.tweens.add({ targets: sir, y: y - 40, duration: 1200, yoyo: true, repeat: -1, ease: 'Sine.inOut' });
      return { y, side, wrong, tpl: pick(ODY_SIDE), siren: i > 0 ? pick(SIREN_SIDE) : null };
    });
    // small rocks between the big ones: steer around them (bumping one is not a reading mistake)
    this.smalls = [];
    this.gates.forEach(gt => { for (let k = 0; k < 2; k++) {
      const x = Phaser.Math.Between(this.cx - 330, this.cx + 330), y = gt.y + 220 + k * 190 + Phaser.Math.Between(-30, 30);
      this.smalls.push({ x, y, img: this.add.image(x, y, 'rock').setScale(0.42).setDepth(10) });
    } });
    this.ship = this.makeShip(this.cx, this.wh - 150);
    this.cameras.main.startFollow(this.ship, true, 0.1, 0.1, 0, 230);
    this.gi = 0; this.announced = -1; this.crashing = false;
    window.voyage = this;
  }
  announce() {
    const g = this.gates[this.gi];
    this.announced = this.gi;
    this.note(g.tpl[0](g.side, g.wrong), g.tpl[1](g.side, g.wrong), 'odysseus');
    this.note2(g.siren ? g.siren(g.wrong) : null, 'siren');
    if (g.siren) sfx.song();
  }
  update() {
    if (this.baseUpdate()) { this.ship.setVelocity(0, 0); return; }
    if (this.gi >= this.gates.length) { this.ship.setVelocity(0, 0); return; }
    const k = this.keys, g = this.gates[this.gi];
    if (this.announced !== this.gi && this.ship.y < g.y + 560) this.announce();
    if (this.crashing) return;
    let vx = 0; if (k.left.isDown || k.a.isDown) vx -= 1; if (k.right.isDown || k.d.isDown) vx += 1;
    this.ship.setVelocity(vx * 270, -150);
    this.ship.angle = vx * 12;
    for (const r of this.smalls) if (!r.hit && Math.abs(this.ship.x - r.x) < 55 && Math.abs(this.ship.y - r.y) < 60) {
      r.hit = true; this.time.delayedCall(1500, () => r.hit = false);
      this.crashing = true; this.ship.setVelocity(0, 0); sfx.splash(); this.cameras.main.shake(150, 0.005);
      this.floatText('Bump! Watch out for the rocks!', this.ship.x, this.ship.y - 110, '#fff8e6', 26);
      this.tweens.add({ targets: this.ship, y: this.ship.y + 170, angle: 0, duration: 700, ease: 'Quad.out', onComplete: () => this.crashing = false });
      return;
    }
    if (this.ship.y < g.y) {
      const dx = this.ship.x - this.cx;
      if (Math.abs(dx) < 95) return this.crash('Go around the rock!');
      const side = dx < 0 ? 'left' : 'right';
      if (side !== g.side) return this.crash('The Sirens trick you! Read again.');
      sfx.good(); this.addCoins(this.cur.mistakes ? 1 : 3, this.ship.x, this.ship.y - 60);
      this.floatText(this.cur.mistakes ? 'Good!' : 'Perfect!', this.ship.x, this.ship.y - 100, '#ffe066', 30);
      this.gi++; this.note2(null);
      if (this.gi >= this.gates.length) { this.clearNote(); this.ship.setVelocity(0, 0); this.time.delayedCall(800, () => this.story(VOY_STORY.SirensEnd, () => this.finishIsland(3))); }
    }
  }
  crash(msg) {
    this.crashing = true; this.ship.setVelocity(0, 0); sfx.splash();
    this.miss(msg, this.ship.x, this.ship.y - 110, false);
    this.note2(this.gates[this.gi].siren ? this.gates[this.gi].siren(this.gates[this.gi].wrong) : null, 'siren');
    this.tweens.add({ targets: this.ship, x: this.cx, y: this.gates[this.gi].y + 430, angle: 0, duration: 900, ease: 'Quad.out', onComplete: () => this.crashing = false });
  }
}

const LANES = [420, 640, 860];
class Storm extends Base {
  constructor() { super('Storm'); }
  create() {
    this.setup(W, H, "Poseidon's Storm");
    this.sea = this.tile(W / 2, H / 2, W, H, 'darksea');
    this.rain = this.add.particles(0, 0, 'soft', { x: { min: 0, max: W }, y: -20, speedY: { min: 600, max: 900 }, speedX: -80, lifespan: 1200, scaleX: 0.15, scaleY: 1.2, alpha: 0.5, frequency: 12 }).setDepth(60);
    this.pose = this.pic(['card_poseidon'], '🔱', W - 160, 300, 260).setDepth(5).setAlpha(0.35);
    this.lane = 1;
    this.ship = this.add.image(LANES[1], 600, 'ship').setDepth(50);
    this.tweens.add({ targets: this.ship, angle: { from: -5, to: 5 }, duration: 900, yoyo: true, repeat: -1, ease: 'Sine.inOut' });
    this.safe = 0; this.last = -1; this.waiting = false;
    window.voyage = this;
    this.story(VOY_STORY.Storm1, () => this.warn());
  }
  warn() {
    if (this.safe >= 8) return this.calm();
    let i; do { i = Phaser.Math.Between(0, STORM.length - 1); } while (i === this.last);
    this.last = i; this.w = STORM[i];
    // lane 2 (index) of the "go to the middle" warning: the danger is the right lane and the left lane
    this.note(this.w[0], this.w[1], 'athena');
    this.repeatWarn();
  }
  repeatWarn() {
    this.waiting = true;
    this.time.delayedCall(3300, () => this.strike());
  }
  strike() {
    const danger = this.w[2];
    danger.forEach(l => {
      if (this.w[0].startsWith('Lightning')) {
        const b = this.add.image(LANES[l], 360, 'bolt').setDepth(70).setScale(1.6); this.cameras.main.flash(150, 255, 255, 220); sfx.thunder();
        this.time.delayedCall(350, () => b.destroy());
      } else {
        const wv = this.add.image(LANES[l], -80, 'wave').setDepth(70).setScale(0.9);
        this.tweens.add({ targets: wv, y: H + 120, duration: 700, ease: 'Quad.in', onComplete: () => wv.destroy() }); sfx.splash();
      }
    });
    this.time.delayedCall(450, () => {
      this.waiting = false;
      if (danger.includes(this.lane)) {
        this.miss('The storm hits the ship! Read again.');
        this.tweens.add({ targets: this.ship, x: LANES[this.lane] + 20, duration: 60, yoyo: true, repeat: 4 });
        this.time.delayedCall(1300, () => this.repeatWarn());
      } else {
        this.safe++; sfx.good(); this.addCoins(this.cur.mistakes ? 1 : 3, this.ship.x, this.ship.y - 60);
        this.floatText(`Safe! (${this.safe}/8)`, this.ship.x, this.ship.y - 110, '#ffe066', 30);
        this.time.delayedCall(1100, () => this.warn());
      }
    });
  }
  calm() {
    this.clearNote(); this.rain.stop();
    this.tweens.add({ targets: this.pose, alpha: 0, duration: 1000 });
    this.tile(W / 2, H / 2, W, H, 'sea').setDepth(1).setAlpha(0).setName('calm');
    this.tweens.add({ targets: this.children.getByName('calm'), alpha: 1, duration: 1500 });
    this.time.delayedCall(1600, () => this.story(VOY_STORY.Ithaca, () => this.finishIsland(5, () => this.ending())));
  }
  ending() {
    const o = this.add.container(0, 0).setDepth(9500);
    o.add(this.add.rectangle(W / 2, H / 2, W, H, 0x050f1e, 0.8).setInteractive());
    o.add(this.add.text(W / 2, 180, 'Home at last!', { fontFamily: 'Cinzel', fontSize: 76, fontStyle: '900', color: '#ffd43b', stroke: '#6b4400', strokeThickness: 10 }).setOrigin(0.5));
    o.add(this.add.text(W / 2, 330, 'You helped Odysseus sail home to Ithaca.\nYou are a true hero of the sea!\n\nYour new cards are in the album in Hermes\' Shop.', { fontFamily: 'Nunito', fontSize: 28, fontStyle: '700', color: '#ffffff', align: 'center', lineSpacing: 6 }).setOrigin(0.5));
    const b = this.add.text(W / 2, 520, 'Back to camp', { fontFamily: 'Cinzel', fontSize: 36, fontStyle: '900', color: '#2b1a0a', backgroundColor: '#ffd43b', padding: { x: 30, y: 12 } }).setOrigin(0.5).setInteractive({ useHandCursor: true }).on('pointerdown', goToCamp);
    o.add(b); o.list.forEach(x => x.setScrollFactor(0)); o.setScrollFactor(0);
    this.keys.enter.once('down', goToCamp);
  }
  update() {
    if (this.baseUpdate()) return;
    this.sea.tilePositionY -= 3; this.sea.tilePositionX += 1;
    const J = Phaser.Input.Keyboard.JustDown, k = this.keys;
    let d = 0; if (J(k.left) || J(k.a)) d = -1; if (J(k.right) || J(k.d)) d = 1;
    if (d) { this.lane = Phaser.Math.Clamp(this.lane + d, 0, 2); this.tweens.add({ targets: this.ship, x: LANES[this.lane], duration: 220, ease: 'Quad.out' }); }
  }
}

Promise.all([document.fonts.load('900 40px Cinzel'), document.fonts.load('900 20px Nunito'), loadManifest()]).catch(() => {}).then(() => {
  new Phaser.Game({
    type: Phaser.AUTO, parent: 'game', backgroundColor: '#0d1b2a',
    render: { antialias: true, mipmapFilter: 'LINEAR_MIPMAP_LINEAR' },
    physics: { default: 'arcade', arcade: { debug: false } },
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH, width: Math.round(W * HD), height: Math.round(H * HD) },
    scene: [Boot, Sea, Lotus, Cyclops, Circe, Sirens, SirensSea, Strait, Storm],
  });
});
</script>
</body>
</html>
